name: Daily KFUPM Update

on:
  schedule:
    # التوقيت العالمي (UTC). الساعة 5:00 الفجر UTC تعادل 8:00 الصباح بتوقيت السعودية.
    - cron: '0 5 * * *'
  workflow_dispatch: # هذا السطر يسمح لك بتشغيل البوت يدوياً في أي وقت بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py
